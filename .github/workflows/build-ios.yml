name: Build Libgopeed iOS xcframework

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GopeedLab/gopeed
          ref: be0a395447d788419e83acdfd693e48a1a1706bf
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go get golang.org/x/mobile/bind
          gomobile init
      - name: Build xcframework
        run: |
          gomobile bind -tags nosqlite -ldflags="-w -s -checklinkname=0" -o Libgopeed.xcframework -target=ios github.com/GopeedLab/gopeed/bind/mobile
          ls -la Libgopeed.xcframework
          du -sh Libgopeed.xcframework
      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Libgopeed.xcframework
          path: Libgopeed.xcframework
